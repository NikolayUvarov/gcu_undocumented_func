[package]
name = "a64-node"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NikolayUvarov/gcu_undocumented_func"
description = "One MIND Core aarch64 program on the A64 emulator in Node, a stand-in for the kernel answering its calls (215-PRT-0016)"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
a64 = { path = ".." }

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
