# Speech models for MIND Core: what scripts/models.py fetches into the model cache and puts on a model disk (main task 251).
# Each model: a stable id, its role (asr: recognition, tts: synthesis), languages, variant (compact: size first; quality:
# accuracy and pronunciation first), the engine family, the licence of its weights and any terms of its training data,
# what was measured (main tasks 250 and 252), the source pinned to a revision, and every file with its size and SHA-256.
# Any free licence is allowed (the maintainer, 2026-10-08); terms that limit use are written in `terms` and travel with the
# model in the cache's MANIFEST.json.

