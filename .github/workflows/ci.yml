# Build with the pinned toolchain, run host tests and the QEMU suites (issue 011).
name: CI

on:
  push:
    # main, claude/**, and track branches under any tool prefix: <tool>/<TRK>-<name>, <tool>/<NNN-TRK-MMMM>-<name> (TRACKS.md)
    branches: [main, "claude/**", "*/[A-Z][A-Z][A-Z]-*", "*/[0-9][0-9][0-9]-[A-Z][A-Z][A-Z]-[0-9][0-9][0-9][0-9]*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustc -V
      - name: Build
        run: ./02_build.sh
      - name: Network driver without legacy support
        run: cd virtio_net && cargo build --release --no-default-features --target-dir /tmp/virtio-net-modern-only
      - name: Clean tree after the build
        run: test -z "$(git status --porcelain)" || { git status --short; exit 1; }
      - name: FAT tools for the FAT host test
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dosfstools mtools
      - name: Host tests
        run: |
          rustc --edition=2021 --test tests/runtime.rs -o /tmp/runtime-tests && /tmp/runtime-tests
          rustc --edition=2021 --test tests/tts_host.rs -o /tmp/tts-tests && /tmp/tts-tests
          for test in heap keys tui viewer idl rtc sysmon monitor fm block fat edit logd search bmp netring window wm clock virtio_input hid aml gpio pins video line beep console say jpeg script cid blockstore dag checkpoint boot_slots http; do
            rustc --edition=2021 --test "tests/${test}_host.rs" -o "/tmp/$test-tests" && "/tmp/$test-tests"
          done
          # The voice tests synthesize and recognize ~1000 phrases and time recognition: optimized, as the system is.
          rustc --edition=2021 -O --test tests/voice_host.rs -o /tmp/voice-tests && /tmp/voice-tests
          python3 tests/idl_test.py
          python3 tests/font_test.py
          python3 tests/manifest_test.py
          python3 tests/release_test.py
          python3 tests/test_usb_writer.py

  # TLA+ models of revoke and MOVE checked by TLC (issue 167, docs/assurance).
  models:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: TLC on the models
        run: scripts/model_check.sh

  qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: boot, display, network, TLS, shell, memory, clock
            args: --suites boot,display,net,tls,normal,memory,dzen
          - name: network benchmark (user networking and tap)
            args: --suites netbench
            tap: true
          - name: services, storage, audio
            args: --suites services,ahci,audio,tts,listen,hda
          - name: scheduling, isolation, heap
            args: --suites busy,smp,isolation,heap
          - name: keys, shell, tools
            args: --suites keys,shell,tools,windows,wm,tablet,usb
          - name: files and block writes
            args: --suites vfs,edit,disk,block,store,storefaults,updater
          - name: NVMe boot disk
            args: --disk nvme --suites vfs
          # Every CPU the machine has, beyond the former 8 (issue 171).
          - name: 16 CPUs
            args: --cpus 16 --suites normal
          # 6 GiB: the frame pool and task memory from the RAM above 4 GiB (issue 171).
          - name: RAM above 4 GiB
            args: --memory 6G --suites normal,display,net,vfs
          - name: one CPU
            args: --cpus 1 --suites smp,isolation,heap,services
          # A CPU with AVX: its state is saved per task with XSAVE (issue 153).
          - name: AVX state
            args: --cpu-model max --suites busy,smp
          - name: AVX state, one CPU
            args: --cpu-model max --cpus 1 --suites busy,smp
          # No PIT: the tick comes from the LAPIC timer, measured on the ACPI PM timer (211-PRT-0003).
          - name: no PIT
            args: --machine pit=off --suites normal,busy
          # The local APIC in x2APIC mode, as firmware leaves it on many PCs (211-PRT-0002).
          - name: x2APIC
            args: --cpu-model max --kernel /tmp/mind-x2apic-target/x86_64-unknown-none/release/kernel --suites normal,busy,smp,isolation
          # The vector area padded to AMX's size, for the frames QEMU cannot emulate (174-KRN-0037).
          - name: padded vector area
            args: --cpu-model max --kernel /tmp/mind-xsave-pad-target/x86_64-unknown-none/release/kernel --suites busy,smp,isolation
          # The kernel reads and jumps into a program's page once: SMAP and SMEP must stop it (000-KRN-0039).
          - name: protection probes
            args: --cpu-model max --kernel /tmp/mind-protection-target/x86_64-unknown-none/release/kernel --suites isolation
          - name: USB image
            usb: true
    name: QEMU (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v5
      - name: QEMU, OVMF and FAT tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf dosfstools mtools
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Build
        run: ./02_build.sh
      - name: Test programs
        run: |
          for fixture in busy_app isolation_app heap_app block_app; do
            rustc --edition=2021 --target x86_64-unknown-none --crate-type bin -C opt-level=3 -C panic=abort \
              -C relocation-model=pic -Z relax-elf-relocations=yes -C link-arg=-Tapp/linker.ld \
              "tests/$fixture.rs" -o "/tmp/mind-core-$fixture.elf"
          done
          (cd tests/updater_stub && cargo build --release --target-dir /tmp/mind-updater-target)
          (cd kernel && cargo build --release --features panic-test --target-dir /tmp/mind-panic-target)
          (cd kernel && cargo build --release --features abi-test --target-dir /tmp/mind-abi-target)
          (cd kernel && cargo build --release --features loader-abi-test --target-dir /tmp/mind-loader-abi-target)
          (cd kernel && cargo build --release --features trial-test --target-dir /tmp/mind-trial-target)
          (cd kernel && cargo build --release --features x2apic-test --target-dir /tmp/mind-x2apic-target)
          (cd kernel && cargo build --release --features bar-move-test --target-dir /tmp/mind-bar-target)
          (cd kernel && cargo build --release --features xsave-pad-test --target-dir /tmp/mind-xsave-pad-target)
          (cd kernel && cargo build --release --features protection-test --target-dir /tmp/mind-protection-target)
      - name: Tap interface for the benchmark (host 10.0.2.2/24; a card on it offers checksum offload)
        if: ${{ matrix.tap }}
        run: |
          sudo ip tuntap add dev mindtap0 mode tap user "$(id -un)"
          sudo ip addr add 10.0.2.2/24 dev mindtap0
          sudo ip link set mindtap0 up
      - name: QEMU suites
        if: ${{ !matrix.usb }}
        run: |
          python3 tests/qemu_smoke.py --qemu qemu-system-x86_64 --firmware /usr/share/ovmf/OVMF.fd \
            --busy-elf /tmp/mind-core-busy_app.elf --isolation-elf /tmp/mind-core-isolation_app.elf \
            --heap-elf /tmp/mind-core-heap_app.elf --block-elf /tmp/mind-core-block_app.elf --updater-elf /tmp/mind-updater-target/x86_64-unknown-none/release/updater_stub \
            --panic-kernel /tmp/mind-panic-target/x86_64-unknown-none/release/kernel --abi-kernel /tmp/mind-abi-target/x86_64-unknown-none/release/kernel \
            --loader-abi-kernel /tmp/mind-loader-abi-target/x86_64-unknown-none/release/kernel --trial-kernel /tmp/mind-trial-target/x86_64-unknown-none/release/kernel --bar-kernel /tmp/mind-bar-target/x86_64-unknown-none/release/kernel ${{ matrix.args }}
      - name: Benchmark over the tap interface (checksum offload off and on)
        if: ${{ matrix.tap }}
        run: python3 tests/qemu_smoke.py --qemu qemu-system-x86_64 --firmware /usr/share/ovmf/OVMF.fd --suites netbench --tap mindtap0 --bench-runs 2
      - name: USB image
        if: ${{ matrix.usb }}
        run: |
          python3 scripts/make_usb_image.py --no-build --force
          python3 tests/usb_image_smoke.py --firmware /usr/share/ovmf/OVMF.fd
      # OVMF's Secure Boot build with test keys enrolled for the run: our signed bootloader only (351-UPD-0012).
      - name: Secure Boot with our keys
        if: ${{ matrix.usb }}
        run: |
          sudo apt-get install -y --no-install-recommends sbsigntool python3-virt-firmware
          python3 tests/secure_boot_smoke.py
          # A dbx update from the running system, signed with our KEK (351-KRN-0028).
          python3 tests/dbx_update_smoke.py
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-logs-${{ strategy.job-index }}
          path: /tmp/mind-core-*

  # aarch64 on QEMU `virt` (issue 201): boot to init, services without devices, fault containment.
  aarch64:
    # QEMU virt (issues 201-204): the same build in every group, then its tests.
    name: aarch64 (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: boot and fault containment
            smoke: true
          - group: programs, shell and four CPUs
            # devicetree: virt without ACPI (210-KRN-0029); efivar: UEFI variables through AAVMF (351-KRN-0028)
            suites: normal,shell,smp,busy,usb,devicetree,efivar
          - group: files, network and TLS
            suites: vfs,store,storefaults,net,tls,updater
          - group: RAM, ACPI and PCI above 4 GiB
            suites: normal,net
            machine: virt,gic-version=3,highmem=on
            memory: 6G
          - group: GICv2 with GICv2m (a Raspberry Pi 4's interrupt controller)
            suites: normal,smp,net
            machine: virt,gic-version=2,highmem=off
          - group: NVMe boot disk
            suites: vfs
            disk: nvme
          - group: 16 CPUs
            suites: normal
            cpus: 16
    steps:
      - uses: actions/checkout@v5
      - name: QEMU for aarch64, AAVMF and FAT tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-arm qemu-efi-aarch64 qemu-utils ipxe-qemu dosfstools mtools
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Build for aarch64
        run: ARCH=aarch64 ./02_build.sh --fixtures
      - name: Boot and fault containment
        if: ${{ matrix.smoke }}
        run: python3 tests/aarch64_smoke.py
      - name: The USB image for aarch64, booted from a USB stick on xHCI
        if: ${{ matrix.smoke }}
        run: |
          python3 scripts/make_usb_image.py --arch aarch64 --no-build --output /tmp/mind-core-usb-aarch64.img
          python3 tests/usb_image_smoke.py --arch aarch64 --image /tmp/mind-core-usb-aarch64.img
      - name: QEMU suites on virt, four CPUs (or the group's count)
        if: ${{ matrix.suites }}
        run: python3 tests/qemu_smoke.py --arch aarch64 --suites ${{ matrix.suites }} ${{ matrix.cpus && format('--cpus {0}', matrix.cpus) || '' }} ${{ matrix.machine && format('--machine {0}', matrix.machine) || '' }} ${{ matrix.memory && format('--memory {0}', matrix.memory) || '' }} ${{ matrix.disk && format('--disk {0}', matrix.disk) || '' }}
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-logs-aarch64-${{ strategy.job-index }}
          path: /tmp/mind-core-*
