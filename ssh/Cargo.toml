[package]
name = "ssh"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NikolayUvarov/gcu_undocumented_func"

# An SSH 2 client for reading files over SFTP (351-NET-0026): no libmind and no I/O of its own, so `cargo test` runs it
# on the host against OpenSSH's server.
[dependencies]
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] } # no SHA-NI: the target has no SSE in its ABI
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"] }
ed25519-dalek = { version = "2", default-features = false }
chacha20 = { version = "0.9", default-features = false }
poly1305 = { version = "0.8", default-features = false }

[dev-dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["fast"] }

[profile.release]
panic = "abort"
opt-level = 3
