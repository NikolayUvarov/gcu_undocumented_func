[package]
name = "httpd"
version = "0.1.0"
edition = "2021"
description = "The project's own web server for releases, on Linux: the release layout read-only over HTTP/1.1 (110, stage 1)"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# TLS 1.3 with the RustCrypto crates the `tls` service uses (THIRD_PARTY.md); no C code.
rustls = { version = "0.23.45", default-features = false, features = ["std"] }
pki-types = { package = "rustls-pki-types", version = "1", features = ["std"] }
# The SPKI of the certificate served, hashed as the updater pins it (tls/src/pinned.rs).
webpki = { package = "rustls-webpki", version = "0.103.13", default-features = false, features = ["std"] }
aead = { version = "0.5", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false }
aes-gcm = { version = "0.10", default-features = false, features = ["aes"] }
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"] }
p256 = { version = "0.13", default-features = false, features = ["ecdh", "ecdsa", "pkcs8", "std"] }
ed25519-dalek = { version = "2", default-features = false, features = ["pkcs8", "std"] }
rsa = { version = "0.9", default-features = false, features = ["sha2", "std"] }
signature = { version = "2", default-features = false }
rand_core = { version = "0.6", default-features = false }
spki = { version = "0.7", default-features = false, features = ["alloc"] }

[dev-dependencies]
sha2 = { version = "0.10", default-features = false }
