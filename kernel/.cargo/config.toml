[build]
target = "x86_64-unknown-none"
rustflags = [
    "-C", "relocation-model=pic",
    "-Z", "relax-elf-relocations=yes",
    "-C", "link-arg=-Tlinker.ld"
]

# aarch64 (issue 201): a static PIE like on x86, relocated by the bootloader.
[target.aarch64-unknown-none-softfloat]
rustflags = [
    "-C", "relocation-model=pic",
    "-C", "link-arg=-Tlinker.ld",
    "-C", "link-arg=-pie",
    "-C", "link-arg=-zmax-page-size=4096",
    "-C", "link-arg=--no-dynamic-linker",
    "-C", "link-arg=-znotext"
]

# wasm64 (215-PRT-0017): a module the page drives; its entry points exported, a stack of 8 MiB.
[target.wasm64-unknown-unknown]
rustflags = [
    "-C", "link-arg=--export=mind_start",
    "-C", "link-arg=--export=mind_turn",
    "-C", "link-arg=--export=mind_console_in",
    "-C", "link-arg=--export=mind_input",
    "-C", "link-arg=--export=mind_heap_base",
    "-C", "link-arg=-zstack-size=8388608",
]
