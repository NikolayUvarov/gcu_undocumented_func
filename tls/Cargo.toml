[package]
name = "tls"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NikolayUvarov/gcu_undocumented_func"

[dependencies]
libmind = { path = "../libmind", features = ["alloc"] }
# TLS 1.3 client without a built-in crypto provider: src/provider.rs supplies one over the RustCrypto crates.
rustls = { version = "0.23.45", default-features = false }
# Not used directly: keeps the certificate verifier under rustls at 0.103.13 or later.
webpki = { package = "rustls-webpki", version = "0.103.13", default-features = false, features = ["alloc"] }
pki-types = { package = "rustls-pki-types", version = "1", default-features = false, features = ["alloc"] }
aead = { version = "0.5", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false }
aes-gcm = { version = "0.10", default-features = false, features = ["aes"] }
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] } # no SHA-NI: the target has no SSE in its ABI
hmac = { version = "0.12", default-features = false }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"] }
p256 = { version = "0.13", default-features = false, features = ["ecdh", "ecdsa"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa"] }
ecdsa = { version = "0.16", default-features = false, features = ["verifying", "der"] }
ed25519-dalek = { version = "2", default-features = false }
rsa = { version = "0.9", default-features = false, features = ["sha2"] }
signature = { version = "2", default-features = false }

[profile.release]
panic = "abort"
opt-level = 3
