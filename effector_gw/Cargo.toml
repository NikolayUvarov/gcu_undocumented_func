[package]
name = "effector_gw"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NikolayUvarov/gcu_undocumented_func"

[lib]
name = "effector_gw"

[dependencies]
libmind = { path = "../libmind", features = ["alloc"] }
apppkg = { path = "../apppkg" } # signed application packages (750-UPD-0019, 750-EFF-0008)

[profile.release]
panic = "abort"
opt-level = 3
