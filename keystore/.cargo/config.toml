[build]
target = "x86_64-unknown-none"
# The target has no SSE registers in its ABI: the RustCrypto crates use their portable backends.
rustflags = [
    "-C", "relocation-model=pic",
    "-Z", "relax-elf-relocations=yes",
    "-C", "link-arg=-Tlinker.ld",
    "--cfg", "curve25519_dalek_backend=\"serial\"",
    "--cfg", "aes_force_soft",
    "--cfg", "polyval_force_soft",
    "--cfg", "chacha20_force_soft",
    "--cfg", "poly1305_force_soft"
]

# aarch64 (issue 201): the same static PIE with 4 KiB segment alignment.
[target.aarch64-unknown-none-softfloat]
rustflags = [
    "-C", "relocation-model=pic",
    "-C", "link-arg=-Tlinker.ld",
    "-C", "link-arg=-pie",
    "-C", "link-arg=-zmax-page-size=4096",
    "-C", "link-arg=--no-dynamic-linker",
    "-C", "link-arg=-znotext",
    "--cfg", "curve25519_dalek_backend=\"serial\"",
    "--cfg", "aes_force_soft",
    "--cfg", "polyval_force_soft",
    "--cfg", "chacha20_force_soft",
    "--cfg", "poly1305_force_soft"
]
