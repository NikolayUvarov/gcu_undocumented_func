[package]
name = "wlansim"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NikolayUvarov/gcu_undocumented_func"

[dependencies]
libmind = { path = "../../libmind", features = ["alloc"] }
dot11 = { path = "../../dot11" }
wpa = { path = "../../wpa" }

[features]
# Test only (550-NET-0030): a radio that answers late, and goes silent when asked; never in a release image.
slow = []
# Test only (550-NET-0035): an access point that announces no country, for the station's 00.
no-country = []

[profile.release]
panic = "abort"
opt-level = 3
