[package]
name = "manifest_fuzz"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# 351-ASR-0006: fuzzing of the bootloader's manifest reader (bootloader/src/verify.rs) on the host, with the same
# crates and versions the bootloader uses. Run: cd tests/manifest_fuzz && cargo test --release
[dependencies]
ed25519-dalek = { version = "=2.2.0", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }
