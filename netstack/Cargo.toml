[package]
name = "netstack"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NikolayUvarov/gcu_undocumented_func"

[dependencies]
libmind = { path = "../libmind", features = ["alloc"] }
smoltcp = { version = "0.14", default-features = false, features = ["alloc", "medium-ethernet", "proto-ipv4", "proto-dhcpv4", "socket-udp", "socket-tcp", "socket-icmp", "socket-dhcpv4"] }

[profile.release]
panic = "abort"
opt-level = 3
