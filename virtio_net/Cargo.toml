[package]
name = "virtio_net"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NikolayUvarov/gcu_undocumented_func"

[dependencies]
libmind = { path = "../libmind" }

[features]
# LEGACY: the legacy VirtIO interface for cards without the modern one (docs/legacy.md).
default = ["legacy"]
legacy = []

[profile.release]
panic = "abort"
opt-level = 3
