\* The kernel as it is: three tasks with two slots each, node ids up to 4, one of them revoking in steps while the
\* others run (two revoking at once: CapRevokeMove_revokers.cfg).
CONSTANTS
    Tasks = {a, b, c}
    Slots = {1, 2}
    MaxIds = 4
    RefuseCovered = TRUE
    Revokers = {a}
    RefuseMappedMove = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK OneWriter NoRevival Narrowing NoGrowth Completion
CHECK_DEADLOCK FALSE
