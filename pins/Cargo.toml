[package]
name = "pins"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NikolayUvarov/gcu_undocumented_func"

# The pins of an ARM board through the gpio service: pins (a console program, issue u015) and pinmap (the header on
# a screen, issue u017).
[lib]
path = "src/lib.rs"

[[bin]]
name = "pins"
path = "src/bin/pins.rs"

[[bin]]
name = "pinmap"
path = "src/bin/pinmap.rs"

[dependencies]
libmind = { path = "../libmind", features = ["alloc"] }

[profile.release]
panic = "abort"
opt-level = 3
